name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Chặn PR mới nếu có job cũ đang chạy -> tiết kiệm runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - build + test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 12345678
          MYSQL_DATABASE: calishealth
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p12345678"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Cache Maven
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('server/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      # `mvnw` tải Maven 3.9.16 + validate trước khi build.
      - name: Build (compile + test)
        working-directory: server
        run: ./mvnw -B verify
        env:
          # Test suite dựng Spring context -> cần DB thật, không dùng H2.
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/calishealth?createDatabaseIfNotExist=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: 12345678

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build
