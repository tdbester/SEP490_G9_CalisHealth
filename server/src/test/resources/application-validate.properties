# Validate profile: H2 in-memory + script SQL thuần + JPA validate
spring.datasource.url=jdbc:h2:mem:calis_test;MODE=Mysql;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V1__init_schema.sql
spring.sql.init.continue-on-error=false
spring.flyway.enabled=false