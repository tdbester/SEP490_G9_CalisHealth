$kind: http-request
url: "{{baseUrl}}/api/content/surveys/{{surveyCode}}/steps/{{bodyStepId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: "{{editBody}}"
scripts:
  - type: beforeRequest
    code: |-
      const o = JSON.parse(pm.collectionVariables.get('bodyOriginal'));
      const questions = o.questions.concat([{ questionCode: 'GOAL_TYPE', required: true }, { questionCode: 'NOT_A_QUESTION', required: true }]);
      pm.collectionVariables.set('editBody', JSON.stringify({ revision: Number(pm.collectionVariables.get('bodyRevision')), stepName: o.stepName, description: o.description, status: 'ACTIVE', questions }));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      const j = pm.response.json();
      const codeOf = q => (j.errors.find(e => e.questionCode === q) || {}).code;
      pm.test('code = INVALID_STEP_QUESTIONS', () => pm.expect(j.code).to.eql('INVALID_STEP_QUESTIONS'));
      pm.test('GOAL_TYPE dang o buoc khac', () => pm.expect(codeOf('GOAL_TYPE')).to.eql('QUESTION_IN_OTHER_STEP'));
      pm.test('NOT_A_QUESTION khong ton tai', () => pm.expect(codeOf('NOT_A_QUESTION')).to.eql('QUESTION_NOT_FOUND'));
    language: text/javascript
order: 5000
