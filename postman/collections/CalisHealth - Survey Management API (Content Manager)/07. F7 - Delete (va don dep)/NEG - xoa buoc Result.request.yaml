$kind: http-request
url: "{{baseUrl}}/api/content/surveys/{{surveyCode}}/steps/{{resultStepId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 409', () => pm.response.to.have.status(409));
      pm.test('code = RESULT_STEP_NOT_DELETABLE', () => pm.expect(pm.response.json().code).to.eql('RESULT_STEP_NOT_DELETABLE'));
    language: text/javascript
order: 1000
