$kind: http-request
url: "{{baseUrl}}/api/content/surveys/{{surveyCode}}/steps/{{newStepId}}/status"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "ACTIVE"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 409', () => pm.response.to.have.status(409));
      pm.test('code = STEP_HAS_NO_QUESTIONS', () => pm.expect(pm.response.json().code).to.eql('STEP_HAS_NO_QUESTIONS'));
    language: text/javascript
order: 1000
