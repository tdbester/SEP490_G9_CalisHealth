$kind: http-request
url: "{{baseUrl}}/api/content/surveys/{{surveyCode}}/steps?status=INACTIVE"
method: GET
queryParams:
  status: INACTIVE
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('co buoc Goals', () => pm.expect(j.steps.map(s => s.stepCode)).to.include('GOALS_AND_MOTIVATION'));
      pm.test('counts.inactive >= 2 (Goals + buoc moi)', () => pm.expect(j.counts.inactive).to.be.at.least(2));
    language: text/javascript
order: 5000
