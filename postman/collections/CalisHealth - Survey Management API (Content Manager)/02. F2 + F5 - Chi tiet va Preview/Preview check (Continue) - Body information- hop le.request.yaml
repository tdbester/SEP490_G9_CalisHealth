$kind: http-request
name: "Preview check (Continue) - Body information: hop le"
url: "{{baseUrl}}/api/content/surveys/{{surveyCode}}/steps/{{bodyStepId}}/preview/check"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "answers": [
        { "questionCode": "GENDER", "value": "MALE" },
        { "questionCode": "AGE", "value": 22 },
        { "questionCode": "HEIGHT", "value": 170 },
        { "questionCode": "WEIGHT", "value": 65 }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('valid = true, khong co loi', () => { pm.expect(j.valid).to.eql(true); pm.expect(j.errors).to.be.empty; });
    language: text/javascript
order: 5000
