$kind: http-request
url: "{{baseUrl}}/api/content/surveys/{{surveyCode}}/steps/{{resultStepId}}/preview"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('khong co cau hoi, co resultConfig', () => { pm.expect(j.questions).to.be.empty; pm.expect(j.resultConfig).to.have.property('planDurationWeeks'); });
      pm.test('buoc Result khong danh so Step n of m', () => { pm.expect(j.memberStepNumber).to.be.null; pm.expect(j.memberStepCount).to.be.null; });
    language: text/javascript
order: 3000
