$kind: http-request
url: "{{baseUrl}}/api/content/surveys/{{surveyCode}}/steps/999999999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 404', () => pm.response.to.have.status(404));
      pm.test('code = STEP_NOT_FOUND', () => pm.expect(pm.response.json().code).to.eql('STEP_NOT_FOUND'));
    language: text/javascript
order: 8000
