$kind: http-request
url: "{{baseUrl}}/api/content/surveys/{{surveyCode}}/steps/{{resultStepId}}/preview/check"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "answers": []
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('code = NOT_A_QUESTION_STEP', () => pm.expect(pm.response.json().code).to.eql('NOT_A_QUESTION_STEP'));
    language: text/javascript
order: 7000
