$kind: http-request
url: "{{baseUrl}}/api/content/surveys/{{surveyCode}}/steps/{{newStepId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "revision": {{newStepRevision}},
      "stepName": "Level test",
      "status": "DRAFT",
      "questions": []
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 409', () => pm.response.to.have.status(409));
      pm.test('code = STEP_NAME_EXISTS', () => pm.expect(pm.response.json().code).to.eql('STEP_NAME_EXISTS'));
    language: text/javascript
order: 10000
