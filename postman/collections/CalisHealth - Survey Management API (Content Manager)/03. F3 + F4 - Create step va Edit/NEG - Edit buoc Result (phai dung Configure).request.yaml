$kind: http-request
url: "{{baseUrl}}/api/content/surveys/{{surveyCode}}/steps/{{resultStepId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "revision": 0,
      "stepName": "Result",
      "status": "ACTIVE",
      "questions": []
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('code = RESULT_STEP_NOT_EDITABLE', () => pm.expect(pm.response.json().code).to.eql('RESULT_STEP_NOT_EDITABLE'));
    language: text/javascript
order: 9000
