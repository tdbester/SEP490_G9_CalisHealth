$kind: http-request
url: "{{baseUrl}}/api/content/surveys/{{surveyCode}}/steps?version=999"
method: GET
queryParams:
  version: "999"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 404', () => pm.response.to.have.status(404));
      pm.test('code = SURVEY_NOT_FOUND', () => pm.expect(pm.response.json().code).to.eql('SURVEY_NOT_FOUND'));
    language: text/javascript
order: 8000
