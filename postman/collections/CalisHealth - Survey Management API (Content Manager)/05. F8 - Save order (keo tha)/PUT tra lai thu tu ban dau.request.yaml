$kind: http-request
url: "{{baseUrl}}/api/content/surveys/{{surveyCode}}/steps/order"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "stepIds": {{currentStepIds}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const expected = JSON.parse(pm.collectionVariables.get('currentStepIds'));
      pm.test('ve lai thu tu cu', () => pm.expect(pm.response.json().steps.map(s => s.id)).to.eql(expected));
    language: text/javascript
order: 3000
