$kind: http-request
url: "{{baseUrl}}/api/content/surveys/{{surveyCode}}/steps/order"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: "{{reorderBody}}"
scripts:
  - type: beforeRequest
    code: |-
      const ids = JSON.parse(pm.collectionVariables.get('currentStepIds'));
      pm.collectionVariables.set('reorderBody', JSON.stringify({ stepIds: ids.slice(1) }));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 409', () => pm.response.to.have.status(409));
      pm.test('code = STEP_ORDER_STALE', () => pm.expect(pm.response.json().code).to.eql('STEP_ORDER_STALE'));
    language: text/javascript
order: 6000
