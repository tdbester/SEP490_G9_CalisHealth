$kind: http-request
url: "{{baseUrl}}/api/content/surveys/{{surveyCode}}/steps"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const ids = pm.response.json().steps.map(s => s.id);
      pm.collectionVariables.set('currentStepIds', JSON.stringify(ids));
    language: text/javascript
order: 1000
